apiVersion: skaffold/v4beta5
kind: Config
metadata:
  name: workshop-service-management
build:
  artifacts:
    - image: workshopapimanagementacrmadsummit24.azurecr.io/address-validation
      context: address-validation-service
      docker:
        dockerfile: Dockerfile
    - image: workshopapimanagementacrmadsummit24.azurecr.io/billing
      context: billing-service
      docker:
        dockerfile: Dockerfile
    - image: workshopapimanagementacrmadsummit24.azurecr.io/customer
      context: customer-service
      docker:
        dockerfile: Dockerfile
    - image: workshopapimanagementacrmadsummit24.azurecr.io/delivery
      context: delivery-service
      docker:
        dockerfile: Dockerfile
    - image: workshopapimanagementacrmadsummit24.azurecr.io/backstage
      context: backstage
      docker:
        dockerfile: Dockerfile
deploy:
  helm:
    releases:
      - name: kube-prometheus-stack
        repo: https://prometheus-community.github.io/helm-charts
        remoteChart: kube-prometheus-stack
        version: 58.7.2
        namespace: observability
        createNamespace: true
        valuesFiles:
          - ./kube-prometheus-stack-values.yaml
      - name: cert-manager
        repo: https://charts.jetstack.io
        remoteChart: cert-manager
        version: 1.14.5
        namespace: cert-manager
        createNamespace: true
        setValues:
          installCRDs: true
      - name: jaeger-operator
        repo: https://jaegertracing.github.io/helm-charts
        remoteChart: jaeger-operator
        version: 2.53.0
        namespace: observability
        createNamespace: true
      - name: opentelemetry-operator
        repo: https://open-telemetry.github.io/opentelemetry-helm-charts
        remoteChart: opentelemetry-operator
        version: 0.60.0
        namespace: observability
        createNamespace: true
        valuesFiles:
          - ./otel-operator-values.yaml
      - name: loki
        repo: https://grafana.github.io/helm-charts
        remoteChart: loki
        version: 6.6.1
        namespace: observability
        createNamespace: true
        valuesFiles:
          - ./loki-values.yaml
      - name: promtail
        repo: https://grafana.github.io/helm-charts
        remoteChart: promtail
        version: 6.15.5
        namespace: observability
        createNamespace: true
        valuesFiles:
          - ./promtail-values.yaml
  statusCheckDeadlineSeconds: 300
  tolerateFailuresUntilDeadline: true

  kubectl: {}

manifests:
  kustomize:
    paths:
      - deployment/base

profiles:
  - name: madsummit24
    activation:
      - kubeContext: workshop-cluster-madsummit24-1
    patches:
      - op: replace
        path: /manifests/kustomize/paths
        value:
          - deployment/madsummit24/cluster1